name: Keep Render Alive

on:
  schedule:
    # S'exécute toutes les 5 minutes pour empêcher Render de passer en mode sommeil (mise en veille après 15 min d'inactivité)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -f https://buelt-systeme.onrender.com/api/health || curl -s https://buelt-systeme.onrender.com/ || true

