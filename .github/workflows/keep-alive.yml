name: Keep Render Alive

on:
  schedule:
    # S'exécute toutes les 10 minutes pour empêcher Render de passer en mode sommeil
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://buelt-systeme.onrender.com/api/health || true
